[project]
name = "interest-memory"
version = "0.1.0"
description = "Learns what a reader likes from weighted feedback and scores new text by it."
readme = "README.md"
authors = [
    { name = "Jay Son" }
]
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.8.1",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
